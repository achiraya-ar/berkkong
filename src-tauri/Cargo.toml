[package]
name = "berkkong"
version = "1.26.1114"
description = "BerkKong — ระบบเบิกของและเวชภัณฑ์ที่มิใช่ยา"
authors = ["BerkKong"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "berkkong_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
